<script>
/* PTPL Design System helper - JANGAN DIUBAH */
(function(){
const C=['#0C1E3C','#B58012','#15803D','#DC2626','#1D4ED8','#7C3AED','#0891B2','#94A3B8'];
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt=(v,u)=>{if(v===null||v===undefined||isNaN(v))return'-';const a=Math.abs(v);let t=a>=1e6?(v/1e6).toFixed(1)+'jt':a>=1e4?Math.round(v/1e3)+'rb':a>=100?Math.round(v).toLocaleString('id-ID'):(Math.round(v*10)/10).toLocaleString('id-ID');return t+(u||'')};
function wrap(l,n){const w=String(l).split(/\s+/);let L=[],c='';w.forEach(x=>{const t=c?c+' '+x:x;if(t.length>n&&c){L.push(c);c=x}else c=t});if(c)L.push(c);return L.slice(0,2)}
function frame(W,H,ml,mt,mr,mb,min,max,u){let s='';const y=v=>mt+(max-v)/(max-min||1)*(H-mt-mb);for(let i=0;i<=4;i++){const v=min+(max-min)*i/4,yy=y(v);s+=('<line x1="'+(ml)+'" y1="'+(yy)+'" x2="'+(W-mr)+'" y2="'+(yy)+'" stroke="#E2E8F0"/><text x="'+(ml-4)+'" y="'+(yy+3)+'" text-anchor="end" font-size="9" fill="#475569">'+(esc(fmt(v,u)))+'</text>')}if(min<0&&max>0)s+=('<line x1="'+(ml)+'" y1="'+(y(0))+'" x2="'+(W-mr)+'" y2="'+(y(0))+'" stroke="#94A3B8"/>');return{s,y}}
function legend(series,ml){let x=ml,s='';series.forEach((d,i)=>{s+=('<rect x="'+(x)+'" y="3" width="8" height="8" fill="'+(d.color||C[i%8])+'"/><text x="'+(x+11)+'" y="10" font-size="9" fill="#334155">'+(esc(d.name))+'</text>');x+=Math.max(60,String(d.name).length*5.6+22)});return s}
function range(vals,zero){let mn=Math.min(...vals),mx=Math.max(...vals);if(zero){mn=Math.min(0,mn);mx=Math.max(0,mx)}const p=(mx-mn)*0.1||1;return[zero&&mn===0?0:mn-p,mx+p]}
function bar(o,W,H){const L=o.labels,S=o.series,u=o.unit||'',ml=48,mr=10,mt=o.series.length>1?18:10,mb=30;const v=[].concat(...S.map(d=>d.data)).filter(x=>x!==null&&!isNaN(x));if(!v.length)return null;const[mn,mx]=range(v,true);const f=frame(W,H,ml,mt,mr,mb,mn,mx,u);let s=f.s;const gw=(W-ml-mr)/L.length,bw=Math.min(26,gw/(S.length+0.6));L.forEach((l,i)=>{const gx=ml+i*gw+gw/2;S.forEach((d,j)=>{const val=d.data[i];if(val===null||isNaN(val))return;const x=gx-bw*S.length/2+j*bw,y0=f.y(0),yv=f.y(val);s+=('<rect x="'+(x+1)+'" y="'+(Math.min(y0,yv))+'" width="'+(bw-2)+'" height="'+(Math.max(1,Math.abs(y0-yv)))+'" fill="'+(d.color||C[j%8])+'"><title>'+(esc(d.name))+' · '+(esc(l))+': '+(esc(fmt(val,u)))+'</title></rect>');if(o.values!==false)s+=('<text x="'+(x+bw/2)+'" y="'+(val>=0?yv-2:yv+8)+'" text-anchor="middle" font-size="7.5" fill="#1F2937">'+(esc(fmt(val,u)))+'</text>')});wrap(l,14).forEach((t,k)=>{s+=('<text x="'+(gx)+'" y="'+(H-mb+11+k*9)+'" text-anchor="middle" font-size="8" fill="#1F2937">'+(esc(t))+'</text>')})});if(S.length>1)s+=legend(S,ml);return s}
function hbar(o,W,H){const L=o.labels,S=o.series,u=o.unit||'',ml=Math.min(170,Math.max(...L.map(l=>String(l).length))*5.2+10),mr=34,mt=S.length>1?16:4,mb=4;const v=[].concat(...S.map(d=>d.data)).filter(x=>x!==null&&!isNaN(x));if(!v.length)return null;const[mn,mx]=range(v,true);const x=val=>ml+(val-mn)/(mx-mn||1)*(W-ml-mr);let s='';const gh=(H-mt-mb)/L.length,bh=Math.min(14,gh/(S.length+0.4));if(mn<0)s+=('<line x1="'+(x(0))+'" y1="'+(mt)+'" x2="'+(x(0))+'" y2="'+(H-mb)+'" stroke="#94A3B8"/>');L.forEach((l,i)=>{const gy=mt+i*gh+gh/2;s+=('<text x="'+(ml-4)+'" y="'+(gy+3)+'" text-anchor="end" font-size="8" fill="#1F2937">'+(esc(String(l).slice(0,34)))+'</text>');S.forEach((d,j)=>{const val=d.data[i];if(val===null||isNaN(val))return;const y=gy-bh*S.length/2+j*bh,x0=x(0),xv=x(val);s+=('<rect x="'+(Math.min(x0,xv))+'" y="'+(y+1)+'" width="'+(Math.max(1,Math.abs(xv-x0)))+'" height="'+(bh-2)+'" fill="'+(d.color||C[j%8])+'"/><text x="'+(val>=0?xv+3:xv-3)+'" y="'+(y+bh/2+3)+'" text-anchor="'+(val>=0?'start':'end')+'" font-size="7.5" fill="#1F2937">'+(esc(fmt(val,u)))+'</text>')})});if(S.length>1)s+=legend(S,ml);return s}
function line(o,W,H){const L=o.labels,S=o.series,u=o.unit||'',ml=48,mr=14,mt=18,mb=22;const v=[].concat(...S.map(d=>d.data)).filter(x=>x!==null&&!isNaN(x));if(!v.length)return null;const[mn,mx]=range(v,o.zero===true);const f=frame(W,H,ml,mt,mr,mb,mn,mx,u);let s=f.s;const gx=i=>ml+(L.length===1?0.5:i/(L.length-1))*(W-ml-mr);L.forEach((l,i)=>s+=('<text x="'+(gx(i))+'" y="'+(H-8)+'" text-anchor="middle" font-size="8" fill="#1F2937">'+(esc(l))+'</text>'));S.forEach((d,j)=>{const col=d.color||C[j%8];let p='';d.data.forEach((val,i)=>{if(val===null||isNaN(val))return;p+=(p?'L':'M')+gx(i)+' '+f.y(val);s+=('<circle cx="'+(gx(i))+'" cy="'+(f.y(val))+'" r="2.6" fill="'+(col)+'"/>');if(o.values!==false)s+=('<text x="'+(gx(i))+'" y="'+(f.y(val)-5)+'" text-anchor="middle" font-size="7.3" fill="'+(col)+'">'+(esc(fmt(val,u)))+'</text>')});s=('<path d="'+(p)+'" fill="none" stroke="'+(col)+'" stroke-width="1.8"/>')+s});s+=legend(S,ml);return s}
function stack(o,W,H){const L=o.labels,S=o.series,ml=Math.min(150,Math.max(...L.map(l=>String(l).length))*5.2+10),mr=8,mt=16,mb=4;let s='';const gh=(H-mt-mb)/L.length,bh=Math.min(16,gh-3);L.forEach((l,i)=>{const tot=S.reduce((a,d)=>a+(+d.data[i]||0),0)||1;let x0=ml;const gy=mt+i*gh+(gh-bh)/2;s+=('<text x="'+(ml-4)+'" y="'+(gy+bh/2+3)+'" text-anchor="end" font-size="8" fill="#1F2937">'+(esc(String(l).slice(0,30)))+'</text>');S.forEach((d,j)=>{const w=(+d.data[i]||0)/tot*(W-ml-mr);if(w<=0)return;s+=('<rect x="'+(x0)+'" y="'+(gy)+'" width="'+(w)+'" height="'+(bh)+'" fill="'+(d.color||C[j%8])+'"><title>'+(esc(d.name))+': '+(esc(fmt(d.data[i],o.unit||'')))+'</title></rect>');if(w>22)s+=('<text x="'+(x0+w/2)+'" y="'+(gy+bh/2+3)+'" text-anchor="middle" font-size="7" fill="#fff">'+(esc(fmt(d.data[i],o.unit||'')))+'</text>');x0+=w})});s+=legend(S,ml);return s}
function matrix(o,W,H){const P=o.points||[];if(!P.length)return null;const ml=46,mr=12,mt=12,mb=26;const xs=P.map(p=>+p.x),ys=P.map(p=>+p.y);const[x0,x1]=range(xs,false),[y0,y1]=range(ys,false);const X=v=>ml+(v-x0)/(x1-x0||1)*(W-ml-mr),Y=v=>mt+(y1-v)/(y1-y0||1)*(H-mt-mb);const med=a=>{const b=[...a].sort((p,q)=>p-q);return b[Math.floor(b.length/2)]};const mx=o.xLine??med(xs),my=o.yLine??med(ys);let s=('<rect x="'+(X(mx))+'" y="'+(mt)+'" width="'+(W-mr-X(mx))+'" height="'+(Y(my)-mt)+'" fill="#F0FDF4"/><rect x="'+(ml)+'" y="'+(Y(my))+'" width="'+(X(mx)-ml)+'" height="'+(H-mb-Y(my))+'" fill="#FEF2F2"/>');s+=('<line x1="'+(X(mx))+'" y1="'+(mt)+'" x2="'+(X(mx))+'" y2="'+(H-mb)+'" stroke="#94A3B8" stroke-dasharray="3 2"/><line x1="'+(ml)+'" y1="'+(Y(my))+'" x2="'+(W-mr)+'" y2="'+(Y(my))+'" stroke="#94A3B8" stroke-dasharray="3 2"/>');const q=o.quadrants||[];if(q.length===4){[[W-mr-4,mt+10,'end',q[0]],[ml+4,mt+10,'start',q[1]],[ml+4,H-mb-4,'start',q[2]],[W-mr-4,H-mb-4,'end',q[3]]].forEach(a=>s+=('<text x="'+(a[0])+'" y="'+(a[1])+'" text-anchor="'+(a[2])+'" font-size="8" font-weight="700" fill="#64748B">'+(esc(a[3]))+'</text>'))}const smax=Math.max(...P.map(p=>+p.size||1));P.forEach((p,i)=>{const r=4+10*Math.sqrt((+p.size||1)/smax);s+=('<circle cx="'+(X(p.x))+'" cy="'+(Y(p.y))+'" r="'+(r)+'" fill="'+(p.color||C[i%8])+'" fill-opacity="0.75" stroke="#fff"><title>'+(esc(p.label))+'</title></circle><text x="'+(X(p.x))+'" y="'+(Y(p.y)-r-2)+'" text-anchor="middle" font-size="7.5" fill="#1F2937">'+(esc(p.label))+'</text>')});s+=('<text x="'+((ml+W-mr)/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="8" fill="#475569">'+(esc(o.xTitle||''))+'</text><text x="10" y="'+((mt+H-mb)/2)+'" font-size="8" fill="#475569" transform="rotate(-90 10 '+((mt+H-mb)/2)+')" text-anchor="middle">'+(esc(o.yTitle||''))+'</text>');[x0,(x0+x1)/2,x1].forEach(v=>s+=('<text x="'+(X(v))+'" y="'+(H-mb+10)+'" text-anchor="middle" font-size="7.5" fill="#475569">'+(esc(fmt(v,o.xUnit||'')))+'</text>'));[y0,(y0+y1)/2,y1].forEach(v=>s+=('<text x="'+(ml-4)+'" y="'+(Y(v)+3)+'" text-anchor="end" font-size="7.5" fill="#475569">'+(esc(fmt(v,o.yUnit||'')))+'</text>'));return s}
function dumbbell(o,W,H){const L=o.labels,a=o.from||[],b=o.to||[],u=o.unit||'',ml=Math.min(170,Math.max(...L.map(l=>String(l).length))*5.2+10),mr=40,mt=16,mb=14;const v=[...a,...b].filter(x=>x!==null&&!isNaN(x));if(!v.length)return null;const[mn,mx]=range(v,o.zero===true);const X=val=>ml+(val-mn)/(mx-mn||1)*(W-ml-mr);let s='';const gh=(H-mt-mb)/L.length;[mn,(mn+mx)/2,mx].forEach(t=>s+=('<line x1="'+(X(t))+'" y1="'+(mt)+'" x2="'+(X(t))+'" y2="'+(H-mb)+'" stroke="#EEF2F7"/><text x="'+(X(t))+'" y="'+(H-3)+'" text-anchor="middle" font-size="7.5" fill="#64748B">'+(esc(fmt(t,u)))+'</text>'));L.forEach((l,i)=>{const y=mt+i*gh+gh/2,p=a[i],q=b[i];s+=('<text x="'+(ml-4)+'" y="'+(y+3)+'" text-anchor="end" font-size="8" fill="#1F2937">'+(esc(String(l).slice(0,34)))+'</text>');if(p!==null&&q!==null&&!isNaN(p)&&!isNaN(q)){const up=q>=p;s+=('<line x1="'+(X(p))+'" y1="'+(y)+'" x2="'+(X(q))+'" y2="'+(y)+'" stroke="'+(up?'#15803D':'#DC2626')+'" stroke-width="2.4"/>');s+=('<text x="'+(Math.max(X(p),X(q))+6)+'" y="'+(y+3)+'" font-size="7.5" font-weight="700" fill="'+(up?'#15803D':'#DC2626')+'">'+(up?'+':'')+(esc(fmt(q-p,o.deltaUnit??u)))+'</text>')}if(p!==null&&!isNaN(p))s+=('<circle cx="'+(X(p))+'" cy="'+(y)+'" r="3.4" fill="#94A3B8"><title>'+(esc(o.fromName||'Awal'))+': '+(esc(fmt(p,u)))+'</title></circle>');if(q!==null&&!isNaN(q))s+=('<circle cx="'+(X(q))+'" cy="'+(y)+'" r="3.8" fill="#0C1E3C"><title>'+(esc(o.toName||'Akhir'))+': '+(esc(fmt(q,u)))+'</title></circle>')});s+=('<circle cx="'+(ml+4)+'" cy="7" r="3.4" fill="#94A3B8"/><text x="'+(ml+11)+'" y="10" font-size="8.5" fill="#334155">'+(esc(o.fromName||'Awal'))+'</text><circle cx="'+(ml+74)+'" cy="7" r="3.8" fill="#0C1E3C"/><text x="'+(ml+82)+'" y="10" font-size="8.5" fill="#334155">'+(esc(o.toName||'Akhir'))+'</text>');return s}
function scatter(o,W,H){const P=(o.points||[]).filter(p=>p&&p.x!==null&&p.y!==null&&!isNaN(p.x)&&!isNaN(p.y));if(P.length<3)return null;const ml=50,mr=14,mt=16,mb=28;const xs=P.map(p=>+p.x),ys=P.map(p=>+p.y);const[x0,x1]=range(xs,false),[y0,y1]=range(ys,false);const X=v=>ml+(v-x0)/(x1-x0||1)*(W-ml-mr),Y=v=>mt+(y1-v)/(y1-y0||1)*(H-mt-mb);let s='';for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4;s+=('<line x1="'+(ml)+'" y1="'+(Y(v))+'" x2="'+(W-mr)+'" y2="'+(Y(v))+'" stroke="#E2E8F0"/><text x="'+(ml-4)+'" y="'+(Y(v)+3)+'" text-anchor="end" font-size="8" fill="#475569">'+(esc(fmt(v,o.yUnit||'')))+'</text>')}[x0,(x0+x1)/2,x1].forEach(v=>s+=('<text x="'+(X(v))+'" y="'+(H-mb+11)+'" text-anchor="middle" font-size="8" fill="#475569">'+(esc(fmt(v,o.xUnit||'')))+'</text>'));if(x0<0&&x1>0)s+=('<line x1="'+(X(0))+'" y1="'+(mt)+'" x2="'+(X(0))+'" y2="'+(H-mb)+'" stroke="#94A3B8" stroke-dasharray="3 2"/>');if(y0<0&&y1>0)s+=('<line x1="'+(ml)+'" y1="'+(Y(0))+'" x2="'+(W-mr)+'" y2="'+(Y(0))+'" stroke="#94A3B8" stroke-dasharray="3 2"/>');if(o.trend!==false&&P.length>=4){const n=P.length,mx=xs.reduce((a,b)=>a+b,0)/n,my=ys.reduce((a,b)=>a+b,0)/n;let sxy=0,sxx=0,syy=0;P.forEach(p=>{sxy+=(p.x-mx)*(p.y-my);sxx+=(p.x-mx)**2;syy+=(p.y-my)**2});if(sxx>0&&syy>0){const b=sxy/sxx,a=my-b*mx,r=sxy/Math.sqrt(sxx*syy);s+=('<line x1="'+(X(x0))+'" y1="'+(Y(a+b*x0))+'" x2="'+(X(x1))+'" y2="'+(Y(a+b*x1))+'" stroke="#B58012" stroke-width="1.6" stroke-dasharray="5 3"/>');s+=('<text x="'+(ml+4)+'" y="'+(H-mb-5)+'" text-anchor="start" font-size="8.5" font-weight="700" fill="#92660A">tren linear · r = '+((Math.round(r*100)/100).toLocaleString('id-ID'))+' · n = '+(n)+'</text>')}}P.forEach((p,i)=>{const col=p.color||C[0];s+=('<circle cx="'+(X(p.x))+'" cy="'+(Y(p.y))+'" r="3.6" fill="'+(col)+'" fill-opacity="0.8" stroke="#fff"><title>'+(esc(p.label||''))+': '+(esc(fmt(p.x,o.xUnit||'')))+' · '+(esc(fmt(p.y,o.yUnit||'')))+'</title></circle>');if(p.label&&o.labels!==false)s+=('<text x="'+(X(p.x)+5)+'" y="'+(Y(p.y)-4)+'" font-size="7" fill="#334155">'+(esc(String(p.label).slice(0,22)))+'</text>')});s+=('<text x="'+((ml+W-mr)/2)+'" y="'+(H-4)+'" text-anchor="middle" font-size="8" fill="#475569">'+(esc(o.xTitle||''))+'</text><text x="10" y="'+((mt+H-mb)/2)+'" font-size="8" fill="#475569" transform="rotate(-90 10 '+((mt+H-mb)/2)+')" text-anchor="middle">'+(esc(o.yTitle||''))+'</text>');return s}
const R={bar,hbar,line,stack,matrix,dumbbell,scatter};
function draw(el){let o;try{o=JSON.parse(el.getAttribute('data-chart'))}catch(e){el.innerHTML='<div style="color:#DC2626;font-size:8px;padding:6px">Data grafik tidak valid</div>';return}const W=Math.max(300,el.clientWidth||600),H=Math.max(90,el.clientHeight||150);const f=R[o.type];const s=f?f(o,W,H):null;el.innerHTML=s?('<svg viewBox="0 0 '+(W)+' '+(H)+'" preserveAspectRatio="none">'+(s)+'</svg>'):'<div style="color:#64748B;font-size:8px;padding:6px">Data belum tersedia</div>'}
function fit(){const max=210/25.4*96;document.querySelectorAll('.page').forEach(p=>{p.style.zoom='';const mh=p.style.minHeight;p.style.minHeight='0';const h=p.scrollHeight;p.style.minHeight=mh;if(h<=max)return;let z=max/h*0.985;p.style.zoom=z.toFixed(4);for(let k=0;k<6;k++){const r=p.getBoundingClientRect().height;if(r<=max)break;z=z*max/r*0.985;p.style.zoom=z.toFixed(4)}})}
function unfit(){document.querySelectorAll('.page').forEach(p=>p.style.zoom='')}
window.addEventListener('afterprint',unfit);
window.addEventListener('beforeprint',fit);
function status(){const b=document.body;if(!b||!b.classList.contains('final'))return;const t=b.getAttribute('data-approved')||'FINAL · Disetujui';document.querySelectorAll('.draft').forEach(e=>{e.textContent=t;e.className='final-badge'})}
document.addEventListener('DOMContentLoaded',()=>{status();document.querySelectorAll('.chart[data-chart]').forEach(draw)});
})();
</script>
